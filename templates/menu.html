<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
</head>
<body>
    <p id="nome">🚚 Bom dia, {{ nome }}! 👷</p>
    <div id='options'>
        <a href="{{ url_for('motorista.painel') }}">Indicadores</a>
        <a href="{{ url_for('motorista.sonho') }}">Sonho</a>
        <a href="{{ url_for('motorista.cinco') }}">5S</a>
        <a href="{{ url_for('motorista.rota') }}">Rota - Processos</a>
        <a href="{{ url_for('motorista.lups') }}">LUPs</a>
        <a href="{{ url_for('motorista.treinamentos') }}">Treinamentos</a>
        <a style="background-color: aqua;" href="https://docs.google.com/forms/d/e/1FAIpQLSf3P2RV6dBeCKFod3-n1PhH2V-tIM_UUrQs6Ek69Ku_gCZTGQ/viewform?pli=1">Ouvidoria</a>
        <a href="{{ url_for('motorista.reconhecimento') }}">Reconhecimento</a>
        <a id="botaoseguranca">Segurança</a>
        <a class="seguranca" href="https://docs.google.com/forms/d/e/1FAIpQLSfeD1wtC553dqkhU02-p_lACALHzyc0e06ZMx-OqwXe6tpmvA/viewform">Abono de Registros <br> Telemetria</a>
        <a class="seguranca" href="https://forms.gle/3vQsnXkofN5xPPWi8">Relato de Segurança</a>
        <a class="seguranca" href="https://docs.google.com/forms/u/0/d/1Ko4kIdYErLDQGIXLivds-iCFNUC3fIDFc0FDkGZD0nI/viewform?edit_requested=true">Relato Positivo</a>
        <a href="{{ url_for('motorista.logout') }}" class="links" id="sair">Sair</a>
    </div>
    <footer>
        <img src="../static/logo.jpg" width="80" height="80">
        <p>João Vitor Borato - Analista de Rota - Tarumã JF</p>
        <p>joaovnogueirabr@gmail.com</p>
        <p>rota@tarumajf.com.br</p>
    </footer>

    <script>
        const botao = document.getElementById('botaoseguranca');
        const segurancaItems = document.querySelectorAll('.seguranca');

        botao.addEventListener('click', function(event) {
            event.preventDefault();
            segurancaItems.forEach(item => {
                if (item.style.display === "none" || item.style.display === "") {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
